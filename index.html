<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niels Thejls</title>
<meta name="description" content="Niels Thejls — designer. Work, index and bio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f3ee;
    --ink: #161616;
    --mute: #8a8984;
    --pad: 12px;
    --gap: 10px;
    --ease: cubic-bezier(.65, 0, .2, 1);
    --t: .7s;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 500 10px/1.25 "IBM Plex Mono", ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: .02em;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a, button { color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }
  a:hover, button:hover, a[aria-current="page"] { color: var(--mute); }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  /* frame: same bar top and bottom, like the reference */
  .bar {
    position: fixed; left: 0; right: 0; z-index: 2;
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; align-items: end;
    padding: var(--pad);
  }
  .bar.top { top: 0; align-items: start; }
  .bar.bottom { bottom: 0; }
  .bar nav { display: flex; gap: 2.2em; justify-self: end; grid-column: 4; }
  .bar .mid { grid-column: 2; justify-self: center; }
  .bar .cap { grid-column: 3; max-width: 26ch; }

  main { height: 100%; }
  section[hidden] { display: none !important; }

  /* work: horizontal strip, active image grows */
  .work { height: 100%; display: flex; align-items: center; overflow: hidden; touch-action: pan-y;
    -webkit-mask-image: linear-gradient(90deg, transparent 4%, #000 12%, #000 88%, transparent 96%);
            mask-image: linear-gradient(90deg, transparent 4%, #000 12%, #000 88%, transparent 96%); }
  .track { display: flex; align-items: center; gap: var(--gap); transition: transform var(--t) var(--ease); will-change: transform; }
  .item { position: relative; flex: none; height: var(--h); transition: height var(--t) var(--ease); cursor: pointer; }
  .item img { display: block; height: 100%; width: auto; user-select: none; -webkit-user-drag: none; }
  .item.on { height: var(--H); cursor: default; }
  .item figcaption {
    position: absolute; left: 0; bottom: calc(100% + 4.5em); width: 26ch;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .item figcaption b { display: block; font-weight: inherit; margin-bottom: 2.4em; }
  .item.on figcaption { opacity: 1; transition-delay: calc(var(--t) * .6); }

  /* index + bio: quiet text pages */
  .page { height: 100%; overflow-y: auto; padding: 18vh var(--pad) 14vh; }
  .rows { width: min(100%, 860px); margin: 0 auto; list-style: none; }
  .rows li { display: grid; grid-template-columns: 6ch 1fr 1fr 8ch; gap: var(--gap); padding: .7em 0; border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
  .rows li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
  .rows li > :last-child { text-align: right; }
  .rows h2 { font: inherit; color: var(--mute); padding: 3.5em 0 1em; }
  .rows h2:first-child { padding-top: 0; }
  .bio-head { width: min(100%, 860px); margin: 0 auto 4em; }
  .bio-head p { max-width: 34ch; margin-left: calc(6ch + var(--gap)); }

  @media (max-width: 640px) {
    .bar { grid-template-columns: 1fr auto; }
    .bar .mid { grid-column: auto; justify-self: end; }
    .bar nav { grid-column: 1 / -1; justify-self: start; }
    .bar.top nav { display: none; }
    .bar .cap { display: none; }
    .rows li { grid-template-columns: 4ch 1fr 7ch; }
    .rows li > :nth-child(3) { display: none; }
    .bio-head p { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { :root { --t: 0s; } }
</style>
</head>
<body>

<header class="bar top">
  <a href="#work">Niels Thejls</a>
  <span class="mid" id="count">(01)</span>
  <nav><a href="#work">Work</a><a href="#bio">Bio</a><a href="#index">Index</a></nav>
</header>

<main>
  <section class="work" id="work" aria-label="Work">
    <div class="track" id="track"></div>
  </section>

  <section class="page" id="index" hidden aria-label="Index">
    <ul class="rows" id="rows"></ul>
  </section>

  <section class="page" id="bio" hidden aria-label="Bio">
    <div class="bio-head">
      <p>Niels Thejls. Designer working across identity, interaction and print. Currently Junior Designer at Spring/Summer.</p>
    </div>
    <ul class="rows" id="cv"></ul>
  </section>
</main>

<footer class="bar bottom">
  <a href="#work">Niels Thejls</a>
  <span class="mid"><button id="prev">(Back)</button> <button id="next">(Next)</button></span>
  <span class="cap" id="cap"></span>
  <nav><a href="#work">Work</a><a href="#bio">Bio</a><a href="#index">Index</a></nav>
</footer>

<script>
  // Edit work here. w/h are the image's pixel size, used for layout before it loads.
  const WORK = [
    { src: "assets/img/print-01.jpg", w: 1080, h: 1350, title: "Portfolio Print 01", note: "Node studies, paper and acetate", year: 2026 },
    { src: "assets/img/print-02.jpg", w: 1080, h: 1350, title: "Portfolio Print 02", note: "Print series, dark", year: 2026 },
    { src: "assets/img/print-02-light.jpg", w: 1080, h: 1350, title: "Portfolio Print 02 / Light", note: "Print series, light", year: 2026 },
    { src: "assets/img/print-03.jpg", w: 1080, h: 1350, title: "Portfolio Print 03", note: "Folded map, clipped index card", year: 2026 },
    { src: "assets/img/print-04.jpg", w: 1080, h: 1350, title: "Portfolio Print 04", note: "Print series", year: 2026 },
    { src: "assets/img/print-05.jpg", w: 1080, h: 1080, title: "Portfolio Print 05", note: "Print series, square", year: 2026 },
  ];
  const SITES = ["ihatebugs.nielsthejls.com", "camera.nielsthejls.com", "kristinesokolowski.com"];
  const CV = {
    Experience: [
      ["Spring/Summer", "Junior Designer", "2026 –"],
      ["Re-Public", "Internship", "2026"],
      ["Stupid Studio", "Freelance", "2025 –"],
      ["Stupid Studio", "Internship", "2024–25"],
      ["Dwarf", "Internship", "2022"],
    ],
    Education: [
      ["Toronto Metropolitan University", "Scholarship, Digital Publishing", "2025"],
      ["Danmarks Medie- og Journalisthøjskole", "BA, Interactive Design", "2022–25"],
      ["Københavns Erhvervsakademi", "AP, Entrepreneurship & Design", "2020–22"],
      ["Fontys Academy for Creative Industries", "Minor, Transmedia Design", "2021"],
    ],
    Recognition: [
      ['<a href="https://www.dandad.org/work/new-blood-archive/the-green-hand" target="_blank" rel="noopener">The Green Hand ↗</a>', "Graphite Pencil, D&AD New Blood", ""],
    ],
  };

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
  const caption = (p) => `${esc(p.note)}, ${p.year}`;

  // --- work strip
  const track = $("track");
  track.innerHTML = WORK.map((p, i) => `
    <figure class="item" data-i="${i}">
      <img src="${p.src}" width="${p.w}" height="${p.h}" alt="${esc(p.title)}" ${i > 2 ? 'loading="lazy"' : ""}>
      <figcaption><b>(${pad(i + 1)})</b>${esc(p.title)}, ${caption(p)}</figcaption>
    </figure>`).join("");
  const items = [...track.children];
  let cur = 0, H = 0, h = 0;

  // Sizes live in JS so the track offset can be computed for the *final* layout,
  // letting the grow and the slide run as one transition.
  function size() {
    const vh = innerHeight, small = innerWidth < 640;
    H = Math.round(vh * (small ? 0.44 : 0.36));
    h = Math.round(vh * (small ? 0.16 : 0.15));
    document.documentElement.style.setProperty("--H", H + "px");
    document.documentElement.style.setProperty("--h", h + "px");
    go(cur);
  }
  function go(i) {
    cur = (i + WORK.length) % WORK.length;
    const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
    let x = 0;
    WORK.forEach((p, j) => { if (j < cur) x += (h * p.w) / p.h + gap; });
    x += (H * WORK[cur].w) / WORK[cur].h / 2;
    track.style.transform = `translateX(${innerWidth / 2 - x}px)`;
    items.forEach((el, j) => el.classList.toggle("on", j === cur));
    $("count").textContent = `(${pad(cur + 1)}/${pad(WORK.length)})`;
    $("cap").innerHTML = `${esc(WORK[cur].title)}, ${caption(WORK[cur])}`;
  }

  track.addEventListener("click", (e) => { const f = e.target.closest(".item"); if (f) go(+f.dataset.i); });
  $("prev").onclick = () => go(cur - 1);
  $("next").onclick = () => go(cur + 1);
  addEventListener("keydown", (e) => {
    if (location.hash && location.hash !== "#work") return;
    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
  });
  // wheel / trackpad: one step per gesture
  let lock = 0;
  $("work").addEventListener("wheel", (e) => {
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(d) < 8 || Date.now() < lock) return;
    lock = Date.now() + 650;
    go(cur + Math.sign(d));
  }, { passive: false });
  // swipe
  let sx = null;
  $("work").addEventListener("pointerdown", (e) => (sx = e.clientX));
  addEventListener("pointerup", (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
  });
  addEventListener("resize", size);
  size();

  // --- index + bio
  const row = (cells) => `<li>${cells.map((c) => `<span>${c}</span>`).join("")}</li>`;
  $("rows").innerHTML =
    `<h2>Work</h2>` +
    WORK.map((p, i) => row([`(${pad(i + 1)})`, `<a href="#work" data-go="${i}">${esc(p.title)}</a>`, esc(p.note), p.year])).join("") +
    `<h2>Sites</h2>` +
    SITES.map((s, i) => row([`(${pad(i + 1)})`, `<a href="https://${s}" target="_blank" rel="noopener">${s} ↗</a>`, "Website", ""])).join("");
  $("rows").addEventListener("click", (e) => { const a = e.target.closest("[data-go]"); if (a) go(+a.dataset.go); });
  $("cv").innerHTML = Object.entries(CV).map(([t, list]) =>
    `<h2>${t}</h2>` + list.map(([org, role, yr], i) => row([`(${pad(i + 1)})`, org, role, yr])).join("")).join("");

  // --- views via hash
  function view() {
    const id = ["index", "bio"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "work";
    document.querySelectorAll("main > section").forEach((s) => (s.hidden = s.id !== id));
    document.querySelectorAll("nav a").forEach((a) => a.hash === "#" + id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    for (const el of [$("count"), $("cap"), $("prev").parentNode]) el.style.visibility = id === "work" ? "" : "hidden";
  }
  addEventListener("hashchange", view);
  view();
</script>
</body>
</html>
